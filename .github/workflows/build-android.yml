name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Prepare Web Assets & Capacitor Config
        run: |
          # 1. Create a clean web distribution folder
          mkdir -p dist
          cp index.html style.css app.js dist/

          # 2. Ensure package.json exists and install dependencies
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # 3. Create capacitor config pointing to dist
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bogus.app",
            "appName": "Bogus",
            "webDir": "dist"
          }
          EOF

          # 4. Clean add and sync android
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bogus-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

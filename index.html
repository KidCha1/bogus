<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bogus</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📼</text></svg>">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="top-nav">
    <h1>BOGUS 📼</h1>
    <div id="nav-actions">
      <button id="open-dm-btn" style="display:none;" onclick="openInbox()">💬 Messages</button>
      <button id="open-auth-btn" onclick="toggleModal('auth-modal', true)">Sign In / Register</button>
      <button id="signout-btn" style="display:none;" onclick="handleSignOut()">Sign Out</button>
    </div>
  </header>

  <main id="video-feed">
    <div class="empty-state">
      <h2>Welcome to Bogus 📼</h2>
      <p>Short-form video for 1946–1996.</p>
    </div>
  </main>

  <button id="upload-fab" onclick="toggleModal('upload-modal', true)">➕ Post Clip</button>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <span class="close-btn" onclick="toggleModal('auth-modal', false)">&times;</span>
      <h2>Enter Bogus</h2>
      <p class="subtitle">Strictly 1946 – 1996.</p>

      <input type="text" id="reg-username" placeholder="Username" />
      <input type="email" id="auth-email" placeholder="Email" />
      <input type="password" id="auth-password" placeholder="Password" />
      <input type="number" id="reg-year" placeholder="Birth Year (e.g. 1985)" min="1946" max="1996" />

      <div id="trivia-box">
        <label id="trivia-question"></label>
        <input type="text" id="trivia-answer" placeholder="Your answer" />
      </div>

      <div class="modal-buttons">
        <button onclick="handleRegister()">Join Bogus</button>
        <button class="secondary" onclick="handleSignIn()">Sign In</button>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="upload-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <span class="close-btn" onclick="toggleModal('upload-modal', false)">&times;</span>
      <h2>Upload Video</h2>
      <input type="file" id="video-file" accept="video/*" />
      <input type="text" id="video-caption" placeholder="Caption" />
      <button id="upload-submit-btn" onclick="handleUpload()">Post to Feed</button>
    </div>
  </div>

  <!-- Report Modal -->
  <div id="report-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <span class="close-btn" onclick="toggleModal('report-modal', false)">&times;</span>
      <h2>Report Content</h2>
      <p class="subtitle">Flag inappropriate material or policy violations.</p>

      <select id="report-reason">
        <option value="suspected_born_after_1996">Suspected born after 1996</option>
        <option value="spam">Spam / Scam</option>
        <option value="illegal">Illegal or Dangerous Content</option>
        <option value="harassment">Harassment / Bullying</option>
        <option value="other">Other Violation</option>
      </select>

      <button id="report-submit-btn" onclick="submitReport()">Submit Report</button>
    </div>
  </div>

  <!-- Messenger Modal -->
  <div id="dm-modal" class="modal-overlay hidden">
    <div class="modal-card dm-card">
      <div class="dm-header">
        <span id="dm-chat-title">Direct Messages</span>
        <span class="close-btn" onclick="toggleModal('dm-modal', false)">&times;</span>
      </div>

      <!-- User Directory -->
      <div id="dm-user-list-view">
        <div class="dm-list-title">Start a Chat</div>
        <div id="dm-users-container"></div>
      </div>

      <!-- Active Thread -->
      <div id="dm-thread-view" class="hidden">
        <button class="dm-back-btn" onclick="showUserList()">← Back to users</button>
        <div id="chat-messages-container"></div>
        <form class="dm-input-row" onsubmit="handleSendMessage(event)">
          <input type="text" id="dm-message-input" placeholder="Type a message..." autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
